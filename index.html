<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeVault</title>
    <!-- External Link -->
    <link rel="stylesheet" href="style.css" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!--  -->
  </head>
  <body class="open-sans">
    <nav id="navbar">
      <div class="img">
        <img src="./images/logo-navbar.png" alt="Logo" />
      </div>
      <div class="menu">
        <a href="#">Features</a>
        <a href="#">How It Works</a>
        <a href="#">Why It's Different</a>
      </div>
      <div class="button">
        <button class="button">Get Early Access</button>
      </div>
    </nav>
    <!-- Banner Section -->
    <section id="banner">
      <div class="banner-box">
        <button class="button">
          <img src="./images/Group 5.png" alt="" /> Early Access Now Open
        </button>
        <h1>
          <span class="color-white">Structured thinking,</span><br /><span
            class="color-green"
            >Not just note-taking.</span
          >
        </h1>
        <p>
          A private space to store notes, links, and learning summaries —
          designed to help you think clearly, connect ideas, and turn learning
          into long-term knowledge.
        </p>
        <div class="btn">
          <button class="btn1">
            Start Building Your Vault
            <img src="./images/ArrowRight.png" alt="" />
          </button>
          <button class="btn2">
            <img src="./images/Play.png" alt="" /> See How It Works
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
